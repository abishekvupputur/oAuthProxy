name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The repository requires Windows for C# because of WPF usage.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        # CodeQL only reads the tree; it never pushes. Keeping GITHUB_TOKEN out of
        # .git/config means a later step or action cannot lift it from there.
        persist-credentials: false

    # Set up specific language environments
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: "8.0.x"

    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        # go.mod is the only place the Go version is written down. Pinning it here as
        # well drifts: setup-go v5 hid that by letting the toolchain download whatever
        # go.mod asked for, and v6 runs GOTOOLCHAIN=local, so a stale pin now fails.
        go-version-file: src/OnePasswordNative/go.mod
        # The module lives under src/, so the default repository-root lookup finds no
        # go.sum and the module cache is silently skipped.
        cache-dependency-path: src/OnePasswordNative/go.sum

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Autobuild triggers clean-build.bat, which launches the app and hangs, so both
        # languages are built by the explicit steps below.
        build-mode: manual
        # If you wish to specify custom queries, you can do so here or in a config file.
        # queries: security-extended,security-and-quality

    - name: Build Go DLL (Required for C#)
      if: matrix.language == 'csharp'
      shell: pwsh
      run: |
        cd src/OnePasswordNative
        $env:CGO_ENABLED = "1"
        go build -buildmode=c-shared -o onepassword.dll main.go

    - name: Build C#
      if: matrix.language == 'csharp'
      run: |
        dotnet restore RavensPort.slnx --locked-mode
        dotnet build RavensPort.slnx -c Release --no-restore

    - name: Build Go
      if: matrix.language == 'go'
      shell: pwsh
      run: |
        cd src/OnePasswordNative
        $env:CGO_ENABLED = "1"
        go build -buildmode=c-shared -o onepassword.dll main.go

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
