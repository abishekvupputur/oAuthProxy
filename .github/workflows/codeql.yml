name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The repository requires Windows for C# because of WPF usage.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        # CodeQL only reads the tree; it never pushes. Keeping GITHUB_TOKEN out of
        # .git/config means a later step or action cannot lift it from there.
        persist-credentials: false

    # Set up specific language environments
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: "8.0.x"

    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: "1.22.x"

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # queries: security-extended,security-and-quality

    # We need to manually build because Autobuild triggers clean-build.bat which launches the app and hangs.
    - name: Build Go DLL (Required for C#)
      if: matrix.language == 'csharp'
      shell: pwsh
      run: |
        cd src/OnePasswordNative
        $env:CGO_ENABLED = "1"
        go build -buildmode=c-shared -o onepassword.dll main.go

    - name: Build C#
      if: matrix.language == 'csharp'
      run: |
        dotnet restore RavensPort.slnx --locked-mode
        dotnet build RavensPort.slnx -c Release --no-restore

    - name: Build Go
      if: matrix.language == 'go'
      shell: pwsh
      run: |
        cd src/OnePasswordNative
        $env:CGO_ENABLED = "1"
        go build -buildmode=c-shared -o onepassword.dll main.go

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
