name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The repository requires Windows for C# because of WPF usage.
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Set up specific language environments
    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Setup Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: "1.22.x"

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # queries: security-extended,security-and-quality

    # Autobuild attempts to build any compiled languages.
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # -------------------------------------------------------------------------
    # Note: If the Autobuild step above fails, remove it and use the manual 
    # build steps below tailored for this repository's structure:
    # -------------------------------------------------------------------------
    # - name: Build C#
    #   if: matrix.language == 'csharp'
    #   run: |
    #     dotnet restore RavensPort.slnx --locked-mode
    #     dotnet build RavensPort.slnx -c Release --no-restore
    #
    # - name: Build Go
    #   if: matrix.language == 'go'
    #   shell: pwsh
    #   run: |
    #     cd src/OnePasswordNative
    #     $env:CGO_ENABLED = "1"
    #     go build -buildmode=c-shared -o onepassword.dll main.go
    # -------------------------------------------------------------------------

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
