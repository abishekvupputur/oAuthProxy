name: Test, build, and release

# Runs when a version tag is pushed (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# test -> (if tests pass) build+publish -> create a GitHub release with the self-contained
# exe attached, named after the tag. Windows-only runner because this is a net8.0-windows
# WPF app; it cannot build on Linux/macOS runners.
#
# Ordinary pushes to main no longer trigger this — cutting a release is now a deliberate
# action (push a tag), not a side effect of every commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload the asset

jobs:
  test-build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OAuthProxy.slnx

      # A failing test step stops the job here (default GitHub Actions behavior) — later
      # steps simply never run, which is the "if tests succeed then build" requirement.
      - name: Test
        run: dotnet test tests/OAuthProxy.Core.Tests/OAuthProxy.Core.Tests.csproj -c Release --no-restore --verbosity normal

      # Publishing OAuthProxy.App triggers WPF's markup-compile step, which intermittently
      # races on a clean obj/ and fails with spurious CS2001/MC1000 errors (see README).
      # clean-build.bat works around this locally with a single retry; do the same here.
      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/OAuthProxy.App/OAuthProxy.App.csproj',
            '-p:PublishProfile=win-x64-selfcontained',
            '-c', 'Release'
          )
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First publish attempt failed - retrying once (WPF markup-compile race)"
            & dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # GITHUB_REF_NAME is the tag itself (e.g. "v1.2.0") when triggered by a tag push.
          $version = $env:GITHUB_REF_NAME
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # Just the exe, renamed with the version so it's unambiguous in the Releases file
      # list — no zip, no bundled LICENSE/notices alongside it.
      - name: Rename artifact
        id: package
        shell: pwsh
        run: |
          $publishDir = "src/OAuthProxy.App/bin/Release/net8.0-windows/publish/win-x64"
          $exeName = "OAuthProxy-${{ steps.version.outputs.version }}.exe"
          Copy-Item "$publishDir/OAuthProxy.exe" $exeName
          echo "exePath=$exeName" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.exePath }}
