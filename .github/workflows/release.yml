name: Test, build, and release

# Runs on every push to main: test -> (if tests pass) build+publish -> create a GitHub
# release with the self-contained exe attached. Windows-only runner because this is a
# net8.0-windows WPF app; it cannot build on Linux/macOS runners.
on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create the release and upload the asset

jobs:
  test-build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OAuthProxy.slnx

      # A failing test step stops the job here (default GitHub Actions behavior) — later
      # steps simply never run, which is the "if tests succeed then build" requirement.
      - name: Test
        run: dotnet test tests/OAuthProxy.Core.Tests/OAuthProxy.Core.Tests.csproj -c Release --no-restore --verbosity normal

      # Publishing OAuthProxy.App triggers WPF's markup-compile step, which intermittently
      # races on a clean obj/ and fails with spurious CS2001/MC1000 errors (see README).
      # clean-build.bat works around this locally with a single retry; do the same here.
      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/OAuthProxy.App/OAuthProxy.App.csproj',
            '-p:PublishProfile=win-x64-selfcontained',
            '-c', 'Release'
          )
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First publish attempt failed - retrying once (WPF markup-compile race)"
            & dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "v1.0.$env:GITHUB_RUN_NUMBER"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package release artifact
        id: package
        shell: pwsh
        run: |
          $publishDir = "src/OAuthProxy.App/bin/Release/net8.0-windows/publish/win-x64"
          $stagingDir = "release-staging"
          New-Item -ItemType Directory -Path $stagingDir | Out-Null
          Copy-Item "$publishDir/OAuthProxy.exe" $stagingDir
          Copy-Item "LICENSE" $stagingDir
          Copy-Item "THIRD-PARTY-NOTICES.md" $stagingDir
          Copy-Item "README.md" $stagingDir

          $zipName = "OAuthProxy-win-x64-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName
          echo "zipPath=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zipPath }}
