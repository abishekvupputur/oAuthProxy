name: PR Check

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Restore
        run: dotnet restore RavensPort.slnx --locked-mode

      - name: Test Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          go test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o onepassword.dll main.go
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test
        run: dotnet test tests/RavensPort.Core.Tests/RavensPort.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/RavensPort.App/RavensPort.App.csproj',
            '-p:PublishProfile=win-x64-selfcontained',
            '-c', 'Release'
          )
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First publish attempt failed - retrying once (WPF markup-compile race)"
            & dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
