name: Build and publish the Store MSIX

# Runs when an MSIX tag is pushed (e.g. `git tag MSIX-v4.1.5 && git push origin MSIX-v4.1.5`):
# test -> (if tests pass) publish -> pack the MSIX -> attach it to a release on that tag, here.
# Download the asset and upload it to Partner Center.
#
# Separate from release.yml on purpose, and it touches nothing that workflow owns. The installer
# release and the Store package now move independently: a Store resubmission does not need a new
# installer release, and a `v*` tag does not build a 100 MB package nobody asked for.
#
# Why MSIX at all: Store policy 10.2.9 requires every PE in an EXE/MSI submission to be signed by a
# CA in the Microsoft Trusted Root Program, and the Inno installer is not signed. Microsoft signs
# MSIX packages itself during ingestion, at no cost -- so the package this builds is deliberately
# left unsigned. Signing it here would get the upload rejected instead, because the certificate
# subject would no longer match the publisher Partner Center has on file.
#
# The tag pattern is case-sensitive, as git tags are: MSIX-v4.1.5, not msix-v4.1.5.
on:
  push:
    tags: ["MSIX-v*"]

# Third-party actions are pinned to commit SHAs, not tags, for the reason release.yml gives: a tag
# is mutable, and whoever controls the action's repo could repoint it at new code that then runs in
# a job holding contents:write and producing the binary users install.
#
# Read-only by default; the one job that needs to publish opts in below, so any job added later
# starts with no write access rather than inheriting it.
permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the package
      id-token: write # OIDC token used to sign the build provenance attestation
      attestations: write # publish that attestation to this repo

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release is published through the GitHub API by the step below, not by a git push,
          # so nothing needs credentials in .git/config -- and this job holds contents:write, which
          # makes a token left lying there the worst one to leak.
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22.x"
          # The Go module lives in a subdirectory, so setup-go's default lookup for go.sum at the
          # repository root finds nothing and logs "Restore cache failed" on every run. Pointing it
          # at the real file silences that and actually caches the module downloads.
          cache-dependency-path: src/OnePasswordNative/go.sum

      - name: Restore
        run: dotnet restore RavensPort.slnx --locked-mode

      - name: Test Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          go test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Go DLL
        shell: pwsh
        run: |
          cd src/OnePasswordNative
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o onepassword.dll main.go
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # A failing test stops the job here, so nothing reaches the Store that did not pass.
      - name: Test
        run: dotnet test tests/RavensPort.Core.Tests/RavensPort.Core.Tests.csproj -c Release --no-restore --verbosity normal

      # Loose files, not a single file: MSIX compresses and block-dedupes its own payload, so a
      # Store update sends only the blocks that changed -- which relinking a single-file bundle
      # defeats, because it rewrites every one of them. It also drops the extract-to-temp step
      # single-file performs on each cold start. See the win-x64-msix publish profile.
      - name: Publish (payload for the MSIX)
        shell: pwsh
        run: |
          $publishArgs = @(
            'publish', 'src/RavensPort.App/RavensPort.App.csproj',
            '-p:PublishProfile=win-x64-msix',
            '-c', 'Release'
          )
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First publish attempt failed - retrying once (WPF markup-compile race)"
            & dotnet @publishArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # GITHUB_REF_NAME is the tag itself when triggered by a tag push. MSIX wants digits, so
          # the "MSIX-v" prefix comes off; build-msix.ps1 pads the result to the four parts the
          # package format requires.
          $version = $env:GITHUB_REF_NAME -replace '^MSIX-v', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}$') {
            Write-Error "Tag '$env:GITHUB_REF_NAME' does not look like MSIX-v<version>, e.g. MSIX-v4.1.5."
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT

      # Fails loudly if packaging/AppxManifest.xml still holds its REPLACE-ME identity values. That
      # is the intended behaviour here: an MSIX tag exists only to produce this package, so a
      # package that Partner Center would reject is not worth publishing.
      - name: Pack the MSIX
        id: msix
        shell: pwsh
        run: |
          $package = ./packaging/build-msix.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -PublishDir 'src/RavensPort.App/bin/Release/net8.0-windows/publish/win-x64-msix' `
            | Select-Object -Last 1

          echo "packagePath=$package" >> $env:GITHUB_OUTPUT

      # Records which workflow, commit, and runner produced this exact package, signed via the job's
      # OIDC identity. It does nothing about the Store copy -- Microsoft re-signs that during
      # ingestion -- but it makes the release asset tamper-evident:
      #
      #   gh attestation verify RavensPort-<version>.msix --repo ${{ github.repository }}
      #
      # Placed before the publish step so an artifact never gets published unattested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.msix.outputs.packagePath }}

      # A release in this repository, on the MSIX-v* tag that triggered the run, with the package
      # attached. GITHUB_TOKEN is enough because nothing crosses a repository boundary -- no PAT,
      # and no separate release repository to keep in step with this one.
      #
      # The MSIX-v* release sits alongside the v* installer releases rather than replacing them:
      # the two artifacts are built from the same commit but answer to different audiences, and a
      # Store resubmission should not have to drag an installer release along with it.
      #
      # generate_release_notes is off deliberately. It diffs against the previous tag, which for an
      # MSIX-v* tag is usually a v* installer tag, so the generated notes would describe the wrong
      # span of commits. The body below says what the artifact actually is instead.
      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RavensPort ${{ steps.version.outputs.version }} (MSIX)
          generate_release_notes: false
          files: ${{ steps.msix.outputs.packagePath }}
          body: |
            Microsoft Store package for RavensPort ${{ steps.version.outputs.version }}.

            **This package is intentionally unsigned.** Partner Center signs it during ingestion
            with a certificate that chains to the Microsoft Trusted Root Program, which is what
            satisfies Store policy 10.2.9. A locally signed package is rejected instead, because
            the certificate subject would not match the publisher on file.

            Built from [`${{ github.repository }}`](https://github.com/${{ github.repository }}) at
            commit `${{ github.sha }}` by [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Verify it is byte-for-byte what CI built:

            ```
            gh attestation verify RavensPort-${{ steps.version.outputs.version }}.msix --repo ${{ github.repository }}
            ```
